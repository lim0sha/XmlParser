services:
  db:
    image: postgres:15-alpine
    container_name: xml_loader_db
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  xml-loader:
    build: .
    container_name: xml_loader_app
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/testdb
      DB_USER: user
      DB_PASS: password
      XML_URL: https://expro.ru/bitrix/catalog_export/export_Sai.xml
      DB_DRIVER: org.postgresql.Driver
    stdin_open: true
    tty: true

volumes:
  pgdata: